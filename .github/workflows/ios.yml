name: Build unsigned iOS IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: auralocal-ipa-publishing
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate iOS project and dependencies
        run: |
          flutter create --platforms=ios --project-name auralocal .
          flutter pub get
          flutter build ios --config-only --release --no-codesign
      - name: Stage native DSP Swift source for iOS compilation
        run: |
          test -f native/ios/AuraDspGraph.swift
          cp native/ios/AuraDspGraph.swift ios/Runner/AuraDspGraph.swift
          cp native/ios/AuraPitchBridge.swift ios/Runner/AuraPitchBridge.swift
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ios/Runner.xcodeproj/project.pbxproj')
          data = p.read_text()
          print('DSP Swift staged for native target integration')
          PY
      - name: Include DSP source in Runner Xcode target
        run: |
          gem install xcodeproj --no-document
          ruby - <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          target = project.targets.find { |t| t.name == 'Runner' }
          abort 'Runner target not found' unless target
          group = project.main_group.find_subpath('Runner', false)
          abort 'Runner group not found' unless group
          ['AuraDspGraph.swift', 'AuraPitchBridge.swift'].each do |name|
            reference = group.files.find { |f| f.path == name } || group.new_file(name)
            unless target.source_build_phase.files_references.include?(reference)
              target.source_build_phase.add_file_reference(reference)
            end
          end
          project.save
          RUBY
      - name: Register native pitch channel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ios/Runner/AppDelegate.swift')
          data = p.read_text()
          # Register from didFinishLaunching regardless of generated Flutter template layout.
          import re
          data = data.replace('import UIKit', 'import UIKit\\nimport Flutter')
          data = data.replace('class AppDelegate: FlutterAppDelegate {', 'class AppDelegate: FlutterAppDelegate {\\n  private var pitchBridge: AuraPitchBridge?')
          match = re.search(r'(\\s*GeneratedPluginRegistrant\\.register\\(with:\\s*self\\))', data)
          if not match:
              raise RuntimeError('Cannot locate Flutter plugin registration in AppDelegate')
          data = data[:match.end()] + '\\n    if let controller = window?.rootViewController as? FlutterViewController {\\n      pitchBridge = AuraPitchBridge(messenger: controller.binaryMessenger)\\n    }' + data[match.end():]
          p.write_text(data)
          PY
      - name: Enable background audio
        run: |
          /usr/libexec/PlistBuddy -c 'Add :UIBackgroundModes array' ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c 'Add :UIBackgroundModes:0 string audio' ios/Runner/Info.plist || true
      - name: Compile unsigned iOS app with Xcode
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-xcode \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build
      - name: Package IPA
        run: |
          APP="build/ios-xcode/Build/Products/Release-iphoneos/Runner.app"
          test -d "$APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr "AuraLocal-build-${{ github.run_number }}-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: AuraLocal-build-${{ github.run_number }}-unsigned-IPA
          path: AuraLocal-build-${{ github.run_number }}-unsigned.ipa
      - name: Publish numbered IPA and latest download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUMBER="${{ github.run_number }}"
          FILE="AuraLocal-build-${NUMBER}-unsigned.ipa"
          TAG="build-${NUMBER}"
          gh release create "$TAG" "$FILE" --title "AuraLocal Build ${NUMBER}" --notes "Chronological build ${NUMBER} from GitHub Actions run ${{ github.run_id }} (commit ${{ github.sha }}). Unsigned IPA: sign with Signulous before installing." --prerelease
          if ! gh release view latest-build >/dev/null 2>&1; then
            gh release create latest-build --title "AuraLocal latest build" --notes "Latest automatically compiled unsigned IPA. Requires signing before iPhone installation." --prerelease
          fi
          gh release upload latest-build "$FILE" --clobber
          cp "$FILE" AuraLocal-unsigned.ipa
          gh release upload latest-build AuraLocal-unsigned.ipa --clobber
          gh release edit latest-build --notes "Latest: Build ${NUMBER} (Actions run ${{ github.run_id }}). For historical builds, see numbered releases. Unsigned IPA requires Signulous."
