name: Build unsigned iOS IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate iOS project and dependencies
        run: |
          flutter create --platforms=ios --project-name auralocal .
          flutter pub get
          flutter build ios --config-only --release --no-codesign
      - name: Enable background audio
        run: |
          /usr/libexec/PlistBuddy -c 'Add :UIBackgroundModes array' ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c 'Add :UIBackgroundModes:0 string audio' ios/Runner/Info.plist || true
      - name: Compile unsigned iOS app with Xcode
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-xcode \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build
      - name: Package IPA
        run: |
          APP="build/ios-xcode/Build/Products/Release-iphoneos/Runner.app"
          test -d "$APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr AuraLocal-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: AuraLocal-unsigned-IPA
          path: AuraLocal-unsigned.ipa
