name: auralocal
description: Offline local audio player prototype
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.3.7
  path_provider: ^2.1.5
  archive: ^4.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  fonts:
    - family: Josefin
      fonts:
        - asset: assets/fonts/JosefinSans.ttf
